<!doctype html>
<!-- Dark only. The inline colour is the linear --background token
     (oklch(0.139 0.003 246.3) = rgb(8 9 10)) so no white flash before CSS. -->
<html lang="en" class="dark" style="background-color: rgb(8 9 10); color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Strict CSP: only same-origin scripts (the Vite bundle plus the
      /wails/ipc.js and /wails/runtime.js the Wails asset server injects), no
      eval, no remote URLs. style-src allows inline styles for React style
      props and component libraries.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secrio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
